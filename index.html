<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>กำลังปรับปรุงระบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      position: relative;
      overflow: hidden;
      padding: 2rem;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .content {
      position: relative;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 100px;
      padding: 6px 18px;
      margin-bottom: 2rem;
    }

    .badge-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #818cf8;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.65); }
    }

    .badge span {
      font-size: 12px;
      font-weight: 500;
      color: #818cf8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }

    h1 em {
      font-style: italic;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtext {
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.75;
      margin-bottom: 2.75rem;
      font-weight: 300;
    }

    .progress-wrap {
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      height: 4px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 72%;           /* ← ปรับตัวเลขนี้ได้ */
      background: linear-gradient(90deg, #818cf8, #c084fc);
      border-radius: 100px;
      animation: shimmer 2.4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.65; }
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 2.75rem;
    }

    .divider {
      width: 1px;
      height: 40px;
      background: rgba(255,255,255,0.08);
      margin: 0 auto 2rem;
    }

    .footer-text {
      font-size: 13px;
      color: #475569;
    }

    .footer-text a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>

  <div class="content">
    <div class="badge">
      <div class="badge-dot"></div>
      <span>Maintenance in progress</span>
    </div>

    <h1>กำลัง<em>ปรับปรุง</em><br>ระบบใหม่</h1>

    <p class="subtext">
      เราพักเว็บชั่วคราวเพื่ออัปเกรดให้ดียิ่งขึ้น<br>
      โปรดกลับมาใหม่เร็วๆ นี้ ขอบคุณที่รอ
    </p>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="progress-label">
      <span>ความคืบหน้า</span>
      <span>72%</span>   <!-- ← เปลี่ยนตัวเลขตรงนี้ให้ตรงกับ progress-bar width -->
    </div>

    <div class="divider"></div>

    <p class="footer-text">
      มีข้อสงสัย? ติดต่อ <a href="mailto:hello@example.com">hello@example.com</a>
    </p>
  </div>
</body>
</html>
